[package]
name = "openwasd-hid-host-test"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
btleplug = { path = "../../../btleplug" }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = "1"

serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString"] }
